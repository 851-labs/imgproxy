name: Publish Fork Image

on:
  push:
    branches: ["851"]
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  publish:
    needs: [ci]
    if: ${{ needs.ci.result == 'success' }}
    runs-on: [self-hosted, macOS, ARM64, claudl]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          set-safe-directory: false

      - name: Configure Docker daemon
        shell: bash
        run: |
          set -euo pipefail

          configure_socket() {
            local socket="$1"

            echo "DOCKER_HOST=unix://${socket}" >> "$GITHUB_ENV"
            export DOCKER_HOST="unix://${socket}"

            if docker info >/dev/null 2>&1; then
              echo "Using Docker socket: ${socket}"
              return 0
            fi

            return 1
          }

          sockets=(
            "$HOME/.orbstack/run/docker.sock"
            "$HOME/.docker/run/docker.sock"
            "/var/run/docker.sock"
            "$HOME/.colima/default/docker.sock"
          )

          for socket in "${sockets[@]}"; do
            if [[ -S "${socket}" ]] && configure_socket "${socket}"; then
              exit 0
            fi
          done

          if ! command -v colima >/dev/null 2>&1; then
            brew install colima
          fi

          if colima status >/dev/null 2>&1; then
            colima stop
          fi

          colima start --cpu 6 --memory 12 --disk 80

          if configure_socket "$HOME/.colima/default/docker.sock"; then
            exit 0
          fi

          echo "No working Docker daemon found on this runner"
          exit 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/851-labs/imgproxy
          tags: |
            type=sha,prefix=851-,format=short
            type=raw,value=851-latest
            type=raw,value=851

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
